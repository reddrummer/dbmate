# Publishes this fork's dbmate npm packages to DrumWave's private CodeArtifact
# repository instead of the public npm registry. Mirrors the OIDC -> codeartifact
# login -> npm publish pattern marketplace.monorepo's own sdk-publish.yaml uses
# for @drumwave/mp-internal-sdk / @drumwave/mp-sdk.
#
# Trigger: manual only, via workflow_dispatch. Kept separate from ci.yml's
# `v*` tag trigger so this never collides with (or accidentally piggybacks on)
# the upstream public-npm release flow. Run it after bumping
# pkg/dbmate/version.go to a version string that doesn't exist upstream, e.g.
# "2.35.1-drumwave.1" -- CodeArtifact then just adds it as a new version under
# the existing `dbmate` / `@dbmate/<platform>` names, no precedence questions.
name: Publish to CodeArtifact

on:
  workflow_dispatch: {}

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            image: ubuntu-latest
            arch: 386
            setup: sudo apt-get update && sudo apt-get install -qq gcc-i686-linux-gnu
            env:
              CC: i686-linux-gnu-gcc
              CXX: i686-linux-gnu-g++
          - os: linux
            image: ubuntu-latest
            arch: amd64
            env: {}
          - os: linux
            image: ubuntu-latest
            arch: arm
            setup: sudo apt-get update && sudo apt-get install -qq gcc-arm-linux-gnueabi
            env:
              CC: arm-linux-gnueabi-gcc
              CXX: arm-linux-gnueabi-g++
              GOARM: 6
          - os: linux
            image: ubuntu-latest
            arch: arm64
            setup: sudo apt-get update && sudo apt-get install -qq gcc-aarch64-linux-gnu
            env:
              CC: aarch64-linux-gnu-gcc
              CXX: aarch64-linux-gnu-g++
          - os: macos
            image: macos-latest
            arch: amd64
            env: {}
          - os: macos
            image: macos-latest
            arch: arm64
            env: {}
          - os: windows
            image: windows-latest
            arch: amd64
            setup: choco install sqlite
            env: {}
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ${{ matrix.image }}
    env: ${{ matrix.env }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Setup environment
        run: ${{ matrix.setup }}
      - run: go mod download
      - run: make build ls
        env:
          GOARCH: ${{ matrix.arch }}
          OUTPUT: dbmate-${{ matrix.os }}-${{ matrix.arch }}
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dbmate-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/dbmate-*

  publish:
    name: Publish npm packages to CodeArtifact
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # AWS OIDC
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist

      - run: npm ci
        working-directory: typescript
      - run: npm run generate
        working-directory: typescript
      - run: npm test
        working-directory: typescript

      # Same role/domain/repository sdk-publish.yaml uses in marketplace.monorepo.
      # Confirm this role's trust policy allows this repo's OIDC subject before
      # relying on this workflow -- that's owned by infrastructure.dw-notify,
      # not this repo, and isn't something to assume works on the first run.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: arn:aws:iam::127266044500:role/reddrummer-github-actions-runner
          aws-region: us-east-1
          role-session-name: GitHubActions-CodeArtifact-Publish

      - name: Login npm to CodeArtifact
        run: |
          aws codeartifact login --tool npm \
            --domain drumwave-prod \
            --domain-owner 127266044500 \
            --repository common-library-npm \
            --region us-east-1

      # CodeArtifact's origin-control feature blocks direct publish of any
      # package name the repository has ever fetched from its npm upstream,
      # by default (anti dependency-confusion protection) -- dbmate and
      # @dbmate/<platform> are proxied from npmjs.org today (see
      # marketplace.monorepo's package-lock.json), so without this the
      # publish step below fails with a CodeArtifact-side rejection, not an
      # npm error. Requires codeartifact:PutPackageOriginConfiguration on the
      # assumed role -- reddrummer-github-actions-runner may not have it yet;
      # if this step fails with AccessDenied, an admin needs to grant it or
      # run the equivalent command by hand once.
      - name: Allow direct publish for dbmate packages in CodeArtifact
        working-directory: typescript
        run: |
          for pkg_dir in dist/dbmate dist/@dbmate/*; do
            name=$(node -p "require('./$pkg_dir/package.json').name")
            aws codeartifact put-package-origin-configuration \
              --domain drumwave-prod \
              --domain-owner 127266044500 \
              --repository common-library-npm \
              --format npm \
              --package "$name" \
              --restrictions publish=ALLOW,upstream=ALLOW
          done

      # publish.ts hardcodes --provenance (npm's OIDC trusted-publish flow,
      # npmjs.org-only) and no --registry (implicit npmjs.org default) -- both
      # wrong for a private registry, so this loop reimplements its two lines
      # of real logic against CodeArtifact instead of calling `npm run publish`.
      - name: Publish packages
        working-directory: typescript
        run: |
          for pkg in dist/dbmate dist/@dbmate/*; do
            echo "Publishing $pkg"
            npm publish "$pkg"
          done
